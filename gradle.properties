# ---- Gradle 自身 ----
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=true
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000

# 本机没有系统 JDK，也没配 JAVA_HOME。Loom 1.19 要求 Gradle 跑在 JDK 25 上，
# 而游戏代码仍然编译到 Java 21。CI 上用 -Dorg.gradle.java.home 覆盖这一行。
org.gradle.java.home=C:/Users/zhang/.jdks/jdk-25.0.5+8

# ---- Minecraft / Fabric 版本，全仓库统一 ----
# 升级只改这里，所有 mod 一起生效。Loom 插件的版本在 settings.gradle。
# https://fabricmc.net/develop
minecraft_version=1.21.1
loader_version=0.20.1
fabric_api_version=0.116.17+1.21.1

# ---- 配置 GUI 依赖 ----
# 这两个 jar 内置在 libs/maven/ 里，不走网络（Modrinth 的 maven 对本项目全 404，
# 详见 libs/README.md）。升级方式也写在 libs/README.md。
# 想用配置界面的 mod 在 build.gradle 里加：
#   apply from: rootProject.file('gradle/config-gui.gradle')
midnightlib_version=1.10.0
modmenu_version=11.0.5

# ---- 所有 mod 的默认值 ----
# 每个 mod 的 group 自动取 mod_group_base + 目录名，需要特殊值就在自己的 build.gradle 里覆盖
version=0.1.0
mod_group_base=com.example
