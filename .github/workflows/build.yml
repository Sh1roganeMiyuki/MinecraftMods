name: build
on: [pull_request, push]

# 多模块构建：一条 ./gradlew build 就能构建仓库里所有 mod。
# 新增 mod 不需要改这个文件——settings.gradle 会自动发现带 build.gradle 的一级子目录。
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build all mods
        # --continue：一个 mod 编译失败也继续构建其余的，一次就能看到所有问题
        # runner 上没有本机那条 org.gradle.java.home，用 setup-java 给的 JAVA_HOME 覆盖
        run: ./gradlew build --continue -Dorg.gradle.java.home="$JAVA_HOME"
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mod-jars
          path: |
            */build/libs/*.jar
            !*/build/libs/*-sources.jar
