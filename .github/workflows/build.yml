name: build
on: [pull_request, push]

# 多模块构建：一条 ./gradlew build 就能构建仓库里所有 mod。
# 新增 mod 不需要改这个文件——settings.gradle 会自动发现带 build.gradle 的一级子目录。
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: guard - explosions must go through ImpactEngine
        # 仓库级硬性规则（AGENTS.md 开头「硬性规则」第 1 条）：
        # 所有自定义爆破都必须走 impactengine，禁止直接调 Level#explode。
        # 原版那一个 radius 把破坏范围/伤害/击退绑在一起拆不开，
        # 而且绕开了引擎的安全底线（基岩免疫、扫描上限）和全局调参层。
        #
        # 放在 build 之前：纯 grep，一秒出结果，不用等编译完才知道违规。
        # 过滤掉注释行（文档里引用 level.explode() 是正常的）。
        # 真有正当理由时，在那一行加 impact-engine-exempt: <原因> 就能过。
        run: |
          files=$(find */src -name '*.java' 2>/dev/null | wc -l | tr -d ' ')
          raw=$(grep -rnE '\.explode\(' --include='*.java' */src 2>/dev/null | wc -l | tr -d ' ')
          hits=$(grep -rnE '\.explode\(' --include='*.java' */src 2>/dev/null \
            | grep -vE ':[0-9]+:[[:space:]]*(\*|//|/\*)' \
            | grep -v 'impact-engine-exempt' || true)
          echo "explode guard: scanned $files java files, $raw raw mention(s) incl. comments"
          # 自检：扫不到文件就说明 glob 失效了（比如目录结构变了），
          # 那时候守卫会永远“通过”。一个静默失效的检查比没有检查更糟，所以直接 fail。
          if [ "$files" -eq 0 ]; then
            echo "::error::explode guard scanned 0 java files - the */src glob matched nothing"
            exit 1
          fi
          if [ -n "$hits" ]; then
            echo "::error::these calls bypass ImpactEngine and use Level#explode directly"
            echo "$hits"
            echo ""
            echo "Every custom explosion must go through impactengine."
            echo "See AGENTS.md hard rule 1; the three-step recipe is in impactengine/AGENTS.md."
            echo "For a genuine exception (different physics model) add on that same line:"
            echo "    // impact-engine-exempt: <reason>"
            exit 1
          fi
          echo "explode guard: passed"
      - name: build all mods
        # --continue：一个 mod 编译失败也继续构建其余的，一次就能看到所有问题
        # runner 上没有本机那条 org.gradle.java.home，用 setup-java 给的 JAVA_HOME 覆盖
        run: ./gradlew build --continue -Dorg.gradle.java.home="$JAVA_HOME"
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mod-jars
          path: |
            */build/libs/*.jar
            !*/build/libs/*-sources.jar
