// 公共配置（Loom、Minecraft/Fabric 依赖、仓库源与排序、Java 21、打包、发布、group 派生）
// 全在根 build.gradle 的 subprojects 块里。这里只写 spearmod 自己特有的东西。

// 跨项目访问 sourceSets 必须在 dependencies 块外先拿到 Project 对象：
// 块内的 project(...) 返回的是 ProjectDependency，上面根本没有 sourceSets 属性
def impactEngine = project(':impactengine')
def funmodProject = project(':funmod')

dependencies {
	// 跨子模块依赖另一个 Loom 项目，必须走 namedElements。
	//
	// 写成 modImplementation project(':impactengine') 会死锁：Loom 在【配置阶段】
	// 就要读对方的 remapped jar 来解析 fabric.mod.json，可那个 jar 还没构建出来，
	// 于是报 "Failed to read metadata from .../impactengine-0.1.0.jar"。
	// 单独构建 :impactengine 也救不了，因为根 build.gradle 的 subprojects{} 会配置所有子项目。
	//
	// namedElements 暴露的是未 remap 的输出，配置阶段不需要 jar 存在，绕开了这个死锁。
	// 依据：https://docs.fabricmc.net/develop/loom/ 的 "Depending on Remapped Subprojects"
	implementation project(path: ':impactengine', configuration: 'namedElements')

	// 用了 splitEnvironmentSourceSets() 的多项目，还要单独接对方的 client 源集，
	// 否则 dev 环境里引用不到对方的客户端类
	clientImplementation impactEngine.sourceSets.client.output

	// ---- 以下仅开发环境，用来把门挥扫也拉进同一个测试客户端 ----
	//
	// 不然 :spearmod:runClient 只能测引擎、:funmod:runClient 只能测门，
	// 两边共用 run/ 目录还不能同时开，来回切很烦。
	//
	// 用 runtimeOnly 而不是 modRuntimeOnly：后者同样会让 Loom 在配置阶段读 jar 而死锁。
	// 它不进 spearmod 的 jar，也不该写进 fabric.mod.json 的 depends（两者实际互不依赖）。
	runtimeOnly project(path: ':funmod', configuration: 'namedElements')
	runtimeOnly funmodProject.sourceSets.client.output
}
